name: Docs

on:
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.3.0"
  NPM_VERSION: "11.18.0"

jobs:
  build:
    name: verify production docs
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout green commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.3.0

      - name: Install pinned npm
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v24.3.0"
          test "$(npm --version)" = "11.18.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install checksum-pinned wasm-pack
        run: bun scripts/install-wasm-pack.ts

      - name: Build exact production site
        run: |
          bun run build:packages
          bun run docs:generate
          bun run docs:check
          bun run --filter '@sheetwrite/docs-start' typecheck
          bun run --filter '@sheetwrite/docs-start' build
          bun test scripts/docs.test.ts

      - name: Install Chromium
        run: bun run browser:install

      - name: Smoke production routes and examples
        run: bun run test:browser

      - name: Upload verified static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-docs
          path: docs/dist/client/
          if-no-files-found: error
          retention-days: 1
