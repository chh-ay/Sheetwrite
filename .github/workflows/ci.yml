name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.3.0"
  NPM_VERSION: "11.18.0"
  RUST_VERSION: "1.96.0"
  WASM_TARGET: "wasm32-unknown-unknown"
  WASM_PACK_VERSION: "0.15.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.3.0

      - name: Install pinned npm
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v24.3.0"
          test "$(npm --version)" = "11.18.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Assert clean source checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          bun scripts/verify-clean-build.ts --assert-absent

      - name: Setup pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          rustup target list --installed

      - name: Cache Cargo inputs and intermediates
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            packages/wasm/target
          key: ${{ runner.os }}-cargo-rust-${{ env.RUST_VERSION }}-${{ env.WASM_TARGET }}-wasm-pack-${{ env.WASM_PACK_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'packages/wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-${{ env.RUST_VERSION }}-${{ env.WASM_TARGET }}-wasm-pack-${{ env.WASM_PACK_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-

      - name: Cache Bun downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies from frozen lockfile
        run: bun install --frozen-lockfile

      - name: Changeset status
        run: bun run changeset:status -- --since=origin/develop

      - name: Install checksum-pinned wasm-pack
        run: bun scripts/install-wasm-pack.ts

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked

      - name: Print toolchain contract
        run: |
          bun --version
          node --version
          npm --version
          rustc --version
          wasm-pack --version
          cargo audit --version
          cargo llvm-cov --version

      - name: Install Playwright Chromium
        run: bun run browser:install

      - name: Run canonical non-browser verification graph
        run: bun run verify:ci

      - name: Enforce source coverage
        run: bun run test:coverage

      - name: Browser smoke tests
        run: bun run test:browser


      - name: Upload verification evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-failure-evidence
          path: |
            test-results/dependency-audit/
            test-results/performance-gates/
            test-results/
            playwright-report/
          if-no-files-found: ignore
