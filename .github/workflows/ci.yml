name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Test Rust crate
        working-directory: packages/wasm
        run: cargo test

      - name: Audit Rust dependencies
        working-directory: packages/wasm
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

      - name: Build packages
        run: bun run build

      - name: Node ESM resolution check
        run: bun run verify:node-esm

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build examples site
        run: bun run build:examples

      - name: Packed consumer verification
        run: bun run verify:packed

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:browser

      - name: Changeset status
        run: bunx @changesets/cli status --since=origin/develop
