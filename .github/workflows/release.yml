name: Publish npm release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.3.0"
  NPM_VERSION: "11.18.0"

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      ci_run_id: ${{ steps.preflight.outputs.ci_run_id }}
    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse "${RELEASE_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Require successful CI for the tagged commit
        id: preflight
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-preflight.ts

  publish:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.commit }}
      - name: Setup Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download canonical artifacts from successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.identity.outputs.ci_run_id }}
        run: gh run download "$CI_RUN_ID" --name canonical-release-artifacts --dir test-results/release-artifacts
      - name: Rehash and publish exact tarballs
        env:
          EXPECTED_SHA: ${{ needs.identity.outputs.commit }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: bun scripts/release-publish.ts test-results/release-artifacts
      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          EXPECTED_SHA: ${{ needs.identity.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
            test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = "false"
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$EXPECTED_SHA" --title "Sheetwrite $RELEASE_VERSION" --generate-notes
          fi
