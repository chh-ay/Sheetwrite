name: Feature request
description: Propose a focused Sheetwrite capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem and why current APIs do not solve it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable result, including framework or runtime constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Current Sheetwrite version
      placeholder: "0.1.0 or not yet using Sheetwrite"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Framework, browser or Node, and bundler when applicable.
