[package]
name = "sheetwrite-wasm"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Sheetwrite columnar store and data engine (Rust/WASM)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "sheetwrite_wasm"

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
